<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Control de Asistencias</title>
    <link rel="icon" type="image/png" href="../../public/assets/icono.png">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/Reset_Password.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <i class="fas fa-lock"></i>
            </div>
            <h2>Restablecer Contraseña</h2>
            <p class="subtitle">Ingrese su nueva contraseña</p>

            <!-- ============================================
                 ESTADO 1: Cargando / Validando token
                 ============================================ -->
            <div id="stateLoading" class="loading-state">
                <i class="fas fa-spinner"></i>
                <p>Validando enlace...</p>
            </div>

            <!-- ============================================
                 ESTADO 2: Token inválido / expirado
                 ============================================ -->
            <div id="stateInvalid" style="display: none; text-align: center;">
                <div style="font-size: 48px; color: #dc3545; margin-bottom: 15px;">
                    <i class="fas fa-times-circle"></i>
                </div>
                <p id="invalidMessage" class="subtitle" style="margin-bottom: 20px;">
                    El enlace ha expirado o no es válido.
                </p>
                <a href="../../../index.html" class="link-login">
                    <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>

            <!-- ============================================
                 ESTADO 3: Formulario (oculto hasta validar)
                 ============================================ -->
            <div id="stateForm" style="display: none;">
                <p id="userGreeting" class="subtitle" style="font-weight: 600; color: #1a1a2e; margin-bottom: 15px;"></p>

                <form id="resetForm" onsubmit="return false;" novalidate>
                    <div class="input-group">
                        <label for="newPassword"><i class="fas fa-lock"></i> Nueva contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres"
                                autocomplete="new-password" />
                            <button type="button" class="toggle-password" data-toggle-password="newPassword"
                                aria-label="Mostrar contraseña">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-hint">Debe tener al menos 6 caracteres</div>
                        <div id="newPasswordError" class="error-message" style="display: none;"></div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirmar contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Repita la contraseña"
                                autocomplete="new-password" />
                            <button type="button" class="toggle-password" data-toggle-password="confirmPassword"
                                aria-label="Mostrar contraseña">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div id="confirmPasswordError" class="error-message" style="display: none;"></div>
                    </div>

                    <button type="submit" class="btn" id="resetSubmitBtn">
                        <i class="fas fa-check"></i>
                        <span>Actualizar Contraseña</span>
                    </button>
                </form>
            </div>

            <!-- ============================================
                 ESTADO 4: Éxito
                 ============================================ -->
            <div id="stateSuccess" style="display: none; text-align: center;">
                <div style="font-size: 48px; color: #28a745; margin-bottom: 15px;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <p class="subtitle" style="margin-bottom: 20px;">
                    Su contraseña ha sido actualizada correctamente.
                    Ya puede iniciar sesión con su nueva contraseña.
                </p>
                <a href="../../../index.html" class="link-login">
                    <i class="fas fa-sign-in-alt"></i> Ir al inicio de sesión
                </a>
            </div>

            <!-- Mensajes generales -->
            <div id="resetMessage" class="message-box"></div>
        </div>
    </div>

    <!-- ============================================
         SCRIPTS — con defer y orden correcto
         ============================================ -->

    <!-- 1) Utilidades -->
    <script defer src="../../public/config/config.js"></script>
    <script defer src="../../public/utils/Environment_Detector.js"></script>
    <script defer src="../../public/utils/Api_Client.js"></script>

    <!-- 2) Services -->
    <script defer src="../services/Password_Reset_Services.js"></script>

    <!-- 3) Controllers -->
    <script defer src="../controllers/Reset_Password_Controller.js"></script>

    <!-- 4) Bootstrap (instancia el controller) -->
    <script defer src="../../public/bootstrap/Reset_Bootstrap.js"></script>

    <!-- 5) Bloqueo (opcional) -->
    <script defer src="../../public/utils/Bloqueo.js"></script>
</body>

</html>
